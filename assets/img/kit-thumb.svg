<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 160" role="img" aria-label="Kit complet : brosse, gant et coupe-griffes">
  <defs>
    <pattern id="k-bristles" width="13" height="13" patternUnits="userSpaceOnUse">
      <path d="M6.5 11 V5 q0-2.4 2.4-2.4" stroke="#8b95a8" stroke-width="1.7" fill="none" stroke-linecap="round"/>
    </pattern>
    <pattern id="k-nubs" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2.6" fill="#0f766e" opacity=".28"/>
      <circle cx="14" cy="14" r="2.6" fill="#0f766e" opacity=".28"/>
    </pattern>
    <linearGradient id="k-brush" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9ec0"/><stop offset="1" stop-color="#f4739f"/>
    </linearGradient>
    <linearGradient id="k-glove" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="k-steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/><stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="k-grip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <clipPath id="k-clip"><rect x="72" y="34" width="132" height="176" rx="46"/></clipPath>
  </defs>

  <g transform="translate(0 3) scale(0.5)">
    <rect x="86" y="176" width="48" height="118" rx="24" fill="url(#k-brush)"/>
    <rect x="92" y="150" width="36" height="40" rx="12" fill="url(#k-brush)"/>
    <rect x="24" y="26" width="172" height="140" rx="38" fill="url(#k-brush)"/>
    <rect x="38" y="40" width="144" height="98" rx="24" fill="#f8fafc"/>
    <rect x="38" y="40" width="144" height="98" rx="24" fill="url(#k-bristles)"/>
  </g>

  <g transform="translate(108 21) scale(0.5)">
    <g transform="rotate(-14 60 150)"><rect x="30" y="104" width="58" height="104" rx="29" fill="url(#k-glove)"/></g>
    <rect x="72" y="34" width="132" height="176" rx="46" fill="url(#k-glove)"/>
    <g clip-path="url(#k-clip)"><rect x="72" y="34" width="132" height="176" fill="url(#k-nubs)"/></g>
    <rect x="66" y="206" width="144" height="52" rx="18" fill="#0f766e"/>
  </g>

  <g transform="translate(228 28) scale(0.5)">
    <path d="M140 176 C104 152 100 96 140 74" fill="none" stroke="url(#k-steel)" stroke-width="20" stroke-linecap="round"/>
    <path d="M140 176 C176 152 180 96 140 74" fill="none" stroke="url(#k-steel)" stroke-width="20" stroke-linecap="round"/>
    <rect x="104" y="112" width="72" height="16" rx="8" fill="#fb923c"/>
    <g stroke="url(#k-grip)" stroke-width="26" stroke-linecap="round" fill="none">
      <path d="M140 178 L82 244"/><path d="M140 178 L198 244"/>
    </g>
    <circle cx="140" cy="176" r="16" fill="#334155"/>
  </g>
</svg>
