<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 320" role="img" aria-label="Coupe-griffes sécurisé">
  <defs>
    <linearGradient id="c-steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="c-grip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <ellipse cx="140" cy="300" rx="86" ry="12" fill="#0f172a" opacity=".08"/>

  <!-- blades -->
  <path d="M140 176 C104 152 100 96 140 74" fill="none" stroke="url(#c-steel)" stroke-width="20" stroke-linecap="round"/>
  <path d="M140 176 C176 152 180 96 140 74" fill="none" stroke="url(#c-steel)" stroke-width="20" stroke-linecap="round"/>
  <path d="M140 168 C112 148 110 102 140 84" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".7"/>

  <!-- safety stop -->
  <rect x="104" y="112" width="72" height="16" rx="8" fill="#fb923c"/>
  <rect x="104" y="112" width="72" height="6" rx="3" fill="#ffffff" opacity=".35"/>

  <!-- handles -->
  <g stroke="url(#c-grip)" stroke-width="26" stroke-linecap="round" fill="none">
    <path d="M140 178 L82 244"/>
    <path d="M140 178 L198 244"/>
  </g>
  <g stroke="#f97316" stroke-width="8" stroke-linecap="round" fill="none" opacity=".9">
    <path d="M104 218 L90 234"/>
    <path d="M176 218 L190 234"/>
  </g>

  <!-- pivot -->
  <circle cx="140" cy="176" r="16" fill="#334155"/>
  <circle cx="140" cy="176" r="6" fill="#cbd5e1"/>
</svg>
