<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-label="Le kit complet : brosse auto-nettoyante, gant de massage et coupe-griffes sécurisé">
  <defs>
    <pattern id="h-bristles" width="13" height="13" patternUnits="userSpaceOnUse">
      <path d="M6.5 11 V5 q0-2.4 2.4-2.4" stroke="#8b95a8" stroke-width="1.7" fill="none" stroke-linecap="round"/>
    </pattern>
    <pattern id="h-nubs" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2.6" fill="#0f766e" opacity=".28"/>
      <circle cx="14" cy="14" r="2.6" fill="#0f766e" opacity=".28"/>
    </pattern>
    <linearGradient id="h-brush" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9ec0"/>
      <stop offset="1" stop-color="#f4739f"/>
    </linearGradient>
    <linearGradient id="h-glove" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="h-steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="h-grip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="h-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1f5"/>
      <stop offset="1" stop-color="#eefcf8"/>
    </linearGradient>
    <clipPath id="h-clip"><rect x="72" y="34" width="132" height="176" rx="46"/></clipPath>
  </defs>

  <!-- soft background -->
  <path d="M60 120 q0-90 110-96 q180-10 340 4 q170 5 300 40 q40 12 34 120 q-8 150-40 260 q-14 48-120 52 q-260 12-500 0 q-110-6-118-100 q-14-160 -6-280 z" fill="url(#h-bg)"/>
  <g fill="#f4739f" opacity=".14">
    <g transform="translate(742 128) scale(1.1)">
      <ellipse cx="0" cy="14" rx="15" ry="12"/><circle cx="-14" cy="-6" r="5.5"/><circle cx="-4" cy="-13" r="5.5"/><circle cx="7" cy="-13" r="5.5"/><circle cx="16" cy="-5" r="5.5"/>
    </g>
  </g>
  <g fill="#2dd4bf" opacity=".16">
    <g transform="translate(126 500) scale(.9)">
      <ellipse cx="0" cy="14" rx="15" ry="12"/><circle cx="-14" cy="-6" r="5.5"/><circle cx="-4" cy="-13" r="5.5"/><circle cx="7" cy="-13" r="5.5"/><circle cx="16" cy="-5" r="5.5"/>
    </g>
  </g>

  <!-- BROSSE -->
  <g transform="translate(66 132) scale(0.98)">
    <ellipse cx="110" cy="298" rx="70" ry="12" fill="#0f172a" opacity=".08"/>
    <rect x="86" y="176" width="48" height="118" rx="24" fill="url(#h-brush)"/>
    <rect x="96" y="200" width="28" height="66" rx="14" fill="#ffffff" opacity=".38"/>
    <rect x="92" y="150" width="36" height="40" rx="12" fill="url(#h-brush)"/>
    <rect x="94" y="158" width="32" height="16" rx="8" fill="#ffffff" opacity=".85"/>
    <circle cx="110" cy="166" r="4" fill="#f4739f"/>
    <rect x="24" y="26" width="172" height="140" rx="38" fill="url(#h-brush)"/>
    <rect x="38" y="40" width="144" height="98" rx="24" fill="#f8fafc"/>
    <rect x="38" y="40" width="144" height="98" rx="24" fill="url(#h-bristles)"/>
    <rect x="38" y="40" width="144" height="98" rx="24" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  </g>

  <!-- GANT -->
  <g transform="translate(316 128) scale(1.02)">
    <ellipse cx="132" cy="300" rx="76" ry="12" fill="#0f172a" opacity=".08"/>
    <g transform="rotate(-14 60 150)"><rect x="30" y="104" width="58" height="104" rx="29" fill="url(#h-glove)"/></g>
    <rect x="72" y="34" width="132" height="176" rx="46" fill="url(#h-glove)"/>
    <g clip-path="url(#h-clip)"><rect x="72" y="34" width="132" height="176" fill="url(#h-nubs)"/></g>
    <rect x="72" y="34" width="132" height="176" rx="46" fill="none" stroke="#14b8a6" stroke-width="2.5" opacity=".5"/>
    <rect x="66" y="206" width="144" height="52" rx="18" fill="#0f766e"/>
    <rect x="66" y="220" width="144" height="8" fill="#ffffff" opacity=".25"/>
    <rect x="196" y="214" width="34" height="18" rx="9" fill="#0f766e"/>
    <circle cx="213" cy="223" r="4.5" fill="#5eead4"/>
  </g>

  <!-- COUPE-GRIFFES -->
  <g transform="translate(576 136) scale(0.96)">
    <ellipse cx="140" cy="300" rx="86" ry="12" fill="#0f172a" opacity=".08"/>
    <path d="M140 176 C104 152 100 96 140 74" fill="none" stroke="url(#h-steel)" stroke-width="20" stroke-linecap="round"/>
    <path d="M140 176 C176 152 180 96 140 74" fill="none" stroke="url(#h-steel)" stroke-width="20" stroke-linecap="round"/>
    <path d="M140 168 C112 148 110 102 140 84" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".7"/>
    <rect x="104" y="112" width="72" height="16" rx="8" fill="#fb923c"/>
    <rect x="104" y="112" width="72" height="6" rx="3" fill="#ffffff" opacity=".35"/>
    <g stroke="url(#h-grip)" stroke-width="26" stroke-linecap="round" fill="none">
      <path d="M140 178 L82 244"/><path d="M140 178 L198 244"/>
    </g>
    <g stroke="#f97316" stroke-width="8" stroke-linecap="round" fill="none" opacity=".9">
      <path d="M104 218 L90 234"/><path d="M176 218 L190 234"/>
    </g>
    <circle cx="140" cy="176" r="16" fill="#334155"/>
    <circle cx="140" cy="176" r="6" fill="#cbd5e1"/>
  </g>
</svg>
