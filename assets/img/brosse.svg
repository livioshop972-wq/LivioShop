<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 320" role="img" aria-label="Brosse auto-nettoyante">
  <defs>
    <pattern id="b-bristles" width="13" height="13" patternUnits="userSpaceOnUse">
      <path d="M6.5 11 V5 q0-2.4 2.4-2.4" stroke="#8b95a8" stroke-width="1.7" fill="none" stroke-linecap="round"/>
    </pattern>
    <linearGradient id="b-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9ec0"/>
      <stop offset="1" stop-color="#f4739f"/>
    </linearGradient>
  </defs>

  <ellipse cx="110" cy="298" rx="70" ry="12" fill="#0f172a" opacity=".08"/>

  <!-- handle -->
  <rect x="86" y="176" width="48" height="118" rx="24" fill="url(#b-body)"/>
  <rect x="96" y="200" width="28" height="66" rx="14" fill="#ffffff" opacity=".38"/>
  <!-- neck -->
  <rect x="92" y="150" width="36" height="40" rx="12" fill="url(#b-body)"/>
  <!-- one-click cleaning button -->
  <rect x="94" y="158" width="32" height="16" rx="8" fill="#ffffff" opacity=".85"/>
  <circle cx="110" cy="166" r="4" fill="#f4739f"/>

  <!-- head -->
  <rect x="24" y="26" width="172" height="140" rx="38" fill="url(#b-body)"/>
  <rect x="38" y="40" width="144" height="98" rx="24" fill="#f8fafc"/>
  <rect x="38" y="40" width="144" height="98" rx="24" fill="url(#b-bristles)"/>
  <rect x="38" y="40" width="144" height="98" rx="24" fill="none" stroke="#e2e8f0" stroke-width="2"/>
</svg>
